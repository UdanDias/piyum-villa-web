<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#245C57" />
    <meta name="description" content="Piyum Villa in Weligama. Stay in Surfers Paradise." />
    <title>Piyum Villa | Stay in Surfers Paradise</title>
    <script>
      (function () {
        var preference = 'light';
        try { preference = localStorage.getItem('piyum-villa-theme') || 'light'; } catch (error) {}
        var dark = preference === 'dark' || (preference !== 'light' && preference !== 'dark' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <noscript>Please enable JavaScript to use Piyum Villa.</noscript>
    <div id="root"></div>
  </body>
</html>
